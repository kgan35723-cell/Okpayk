<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OK PAY</title>
    <style>
        :root {
            --primary: #6200EA;
            --primary-hover: #3700B3;
            --bg-gradient: linear-gradient(135deg, #1A1A2E, #16213E);
            --surface: #FFFFFF;
            --text-main: #333333;
            --text-secondary: #7F8C8D;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
        }

        .login-card {
            background: var(--surface);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 24px;
        }

        .logo-container img {
            max-width: 120px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        h2 {
            margin: 0 0 8px 0;
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: #FAFAFA;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(98, 0, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .checkbox-group input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        button.submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(98, 0, 234, 0.3);
        }

        button.submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(98, 0, 234, 0.4);
        }

        button.submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <img src="mainlogo.webp" alt="OK PAY Logo">
    </div>
    <h2>Welcome</h2>
    <p class="subtitle">Log in to your account</p>
    
    <form>
        <div class="input-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number" required>
        </div>

        <div class="input-group">
            <label for="pin">6-Digit PIN</label>
            <input type="password" id="pin" name="pin" pattern="[0-9]{6}" maxlength="6" placeholder="******" required>
        </div>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="remember"> Remember me
            </label>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
    </form>
</div>

</body>
</html>
